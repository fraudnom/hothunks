*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,sans-serif;
    background:linear-gradient(135deg,#edf4ff,#f8fbff);
    color:#18202a;
}


/* ================= HEADER ================= */

header{
    text-align:center;
    padding:50px 20px 18px;
}

header h1{
    font-family:'DM Serif Display',serif;
    font-size:3rem;
}

header p{
    margin-top:8px;
    color:#5f6f86;
}


/* ================= TABS ================= */

.tabs{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    margin:24px 20px;
}

.tab-btn{
    border:none;
    background:#fff;
    color:#4d5f77;
    padding:12px 24px;
    border-radius:40px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.06);
    transition:.25s;
}

.tab-btn:hover{
    transform:translateY(-2px);
}

.tab-btn.active{
    background:#2f6fed;
    color:#fff;
}


/* ================= SEARCH ================= */

.search-box{
    display:flex;
    justify-content:center;
    margin:10px 20px 28px;
}

.search-box input{
    width:min(420px,92%);
    padding:14px 18px;
    border:none;
    border-radius:16px;
    outline:none;
    background:#fff;
    box-shadow:0 8px 20px rgba(33,72,126,.08);
    font-size:15px;
}


/* ================= CONTAINER ================= */

.container{
    max-width:1350px;
    margin:auto;
    padding:24px;
}


/* ================= GRID ================= */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:28px;
}


/* ================= CARD ================= */

.card{
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 10px 24px rgba(33,72,126,.08);
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:0 16px 30px rgba(33,72,126,.14);
}

.card img{
    width:100%;
    aspect-ratio:3/5;
    object-fit:cover;
    display:block;
}

.card-content{
    padding:16px;
    text-align:center;
}

.card-content h3{
    font-size:16px;
}


/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.modal-content{
    background:#fff;
    width:min(350px,92%);
    border-radius:24px;
    overflow:hidden;
}

.modal img{
    width:100%;
    aspect-ratio:3/5;
    object-fit:cover;
    display:block;
}

.modal-body{
    padding:18px;
    text-align:center;
}

.modal-body h2{
    font-family:'DM Serif Display',serif;
}

.close{
    position:absolute;
    top:18px;
    right:24px;
    font-size:30px;
    color:#fff;
    cursor:pointer;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    header{
        padding-top:35px;
    }

    header h1{
        font-size:2.4rem;
    }

    .tabs{

    .container{

    }

    .grid{

    }

    .card{
        border-radius:18px;
    }

    .card-content{
        padding:12px 8px;
    }

    .card-content h3{
        font-size:13px;
    }
}

/* =========================================================
   CREATE ACTOR CARDS
========================================================= */

function createCards(data,id){

    document.getElementById(id).innerHTML = data.map(actor => `

        <div
            class="card"
            onclick="openModal('${actor.name}','${actor.img}')"
        >

            <img
                src="${actor.img}"
                alt="${actor.name}"
                loading="lazy"
            >

            <div class="card-content">

                <h3>
                    ${actor.name}
                </h3>

            </div>

        </div>

    `).join('');

}

/* =========================================================
   SHOW CATEGORY
========================================================= */

function showTab(id,btn){

    /* Hide every category */

    document
        .querySelectorAll('.grid')
        .forEach(grid => {

            grid.style.display = 'none';

        });


    /* Show selected category */

    document.getElementById(id).style.display = 'grid';


    /* Remove active state */

    document
        .querySelectorAll('.tab-btn')
        .forEach(button => {

            button.classList.remove('active');

        });


    /* Activate clicked button */

    btn.classList.add('active');


    /* Clear search */

    document.getElementById('searchInput').value = '';

    searchActors();

}



/* =========================================================
   OPEN MODAL
========================================================= */

function openModal(name,image){

    document.getElementById('modal').style.display = 'flex';

    document.getElementById('modalImg').src = image;

    document.getElementById('modalImg').alt = name;

    document.getElementById('modalTitle').innerText = name;

}



/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    document.getElementById('modal').style.display = 'none';

}



/* =========================================================
   CLOSE MODAL BY CLICKING OUTSIDE
========================================================= */

window.onclick = function(event){

    if(event.target.id === 'modal'){

        closeModal();

    }

};



/* =========================================================
   SEARCH
========================================================= */

function searchActors(){

    const value =
        document
        .getElementById('searchInput')
        .value
        .toLowerCase()
        .trim();


    /* Find currently visible category */

    const activeGrid =
        [...document.querySelectorAll('.grid')]
        .find(grid => grid.style.display === 'grid');


    if(!activeGrid){

        return;

    }


    /* Search cards */

    activeGrid
        .querySelectorAll('.card')
        .forEach(card => {

            const actorName =
                card
                .querySelector('h3')
                .innerText
                .toLowerCase();


            if(actorName.includes(value)){

                card.style.display = 'block';

            }

            else{

                card.style.display = 'none';

            }

        });

}
